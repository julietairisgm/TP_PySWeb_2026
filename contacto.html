<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turismo Global - Tu Viaje Perfecto Comienza Aquí</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body data-theme="dark">
    <header class="header">
        <div class="header-container">
            <nav class="nav">
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Inicio</a></li>
                    <li><a href="destinos.html" class="nav-link">Destinos</a></li>
                    <li><a href="agencias.html" class="nav-link">Agencias</a></li>
                    <li><a href="precios.html" class="nav-link">Precios</a></li>
                    <li><a href="contacto.html" class="nav-link">Contáctanos</a></li>
                    <li><a href="blog.html" class="nav-link">Contáctanos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="contacto">
            <div class="contacto-container">
                <div class="contacto-img">
                    <img src="assets/img/contacto.png" alt="Contacto">
                </div>
                <div class="form-overlay"></div>
                <form class="form-contacto" action="#confirmacion">
                    <h2>Contáctanos</h2>
                    <input type="text" required minlength="3" placeholder="Tu nombre">
                    <input type="email" required placeholder="Tu email">
                    <textarea required minlength="10" placeholder="Déjanos tu mensaje"></textarea>
                    <button type="submit" class="btn-primary">
                        <span class="texto">Enviar</span>
                        <span class="spinner"></span>
                    </button>
                </form>
            </div>
        </section>
    </main>
    <div id="confirmacion" class="modal">
        <div class="modal-contenido">
            <h3>✅ Mensaje enviado</h3>
            <p>Gracias por contactarnos. Te responderemos pronto.</p>
            <a href="#" class="btn-primary">Cerrar</a>
        </div>
    </div>
    <footer class="footer">
        <div class="footer-container">
        <!--Formulario-->
            <div class="footer-section">
                <h3>SUSBRIBETE AL NEWSLETTER</h3>
                <form class="form-content">
                    <label>Recibe las mejores ofertas directamente en tu correo</label>
                    <input type="email" placeholder="tu@email.com" required>
                    <button class="btn btn-primary" type="submit">¡Suscribete!</button>
                </form>
            </div>
        <!--Redes Sociales-->
            <div class="footer-link">
                <a href="#"><i>Facebook</i></a>
                <a href="#"><i>Instagram</i></a>
            </div>
        <!--Mapa-->
            <div class="footer-map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3103.14561023!2d-3.70379!3d40.416775!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDDCsDI1JzAwLjQiTiAzwrA0MicyMC44Ilc!5e0!3m2!1ses!2ses!4v1234567890" 
                    width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </div>
    </footer>


</body>
</html>
