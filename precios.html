<body data-theme="dark">
    <header class="header">
        <div class="header-container">
            <nav class="nav">
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Inicio</a></li>

            </nav>
        </div>

    <main>
        <section class="precios">
        <h2>Comparador de destinos</h2>

        <div class="tabla-container">
            <table class="tabla-precios">
                <thead>
                    <tr>
                        <th>Destino</th>
                        <th>Duración</th>
                        <th>Precio</th>
                        <th>Incluye</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td data-label="Destino" data-tooltip="Ciudad inca en Perú, Patrimonio de la Humanidad (UNESCO)">Machu Picchu</td>
                        <td data-label="Duración" data-tooltip="Incluye días de traslado">5 días</td>
                        <td data-label="Precio" data-tooltip="Precio por persona en base doble">$1200</td>
                        <td data-label="Incluye" data-tooltip="Incluye hotel, excursiones guiadas y traslados internos">Hotel + Tours</td>
                    </tr>

                    <tr>
                        <td data-label="Destino" data-tooltip="Destino turístico en el sudeste asiático">Tailandia</td>
                        <td data-label="Duración" data-tooltip="Incluye actividades y excursiones">7 días</td>
                        <td data-label="Precio" data-tooltip="No incluye vuelos internacionales">$1800</td>
                        <td data-label="Incluye" data-tooltip="Incluye hotel, comidas y excursiones completas">All Inclusive</td>
                    </tr>

                    <tr>
                        <td data-label="Destino" data-tooltip="Destino de playa en América del Sur">Brasil</td>
                        <td data-label="Duración" data-tooltip="Estadía estándar sin excursiones">4 días</td>
                        <td data-label="Precio" data-tooltip="Precio promocional por tiempo limitado">$900</td>
                        <td data-label="Incluye" data-tooltip="Incluye alojamiento y desayuno diario">Hotel + Desayuno</td>
                    </tr>
                </tbody>
            </table>
        </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-container">
        <!--Formulario-->
            <div class="footer-section">
                <h3>SUSBRIBETE AL NEWSLETTER</h3>
                <form class="form-content">
                    <label>Recibe las mejores ofertas directamente en tu correo</label>
                    <input type="email" placeholder="tu@email.com" required>
                    <button class="btn btn-primary" type="submit">¡Suscribete!</button>
                </form>
            </div>
        <!--Redes Sociales-->
            <div class="footer-link">
                <a href="#"><i>Facebook</i></a>

                    width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy">
